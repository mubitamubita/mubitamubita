{% extends 'website/base.html' %}

{% block content %}
<div class="global">
  <h2>Stories</h2>
  <div class="stories-container">
    {% for story in stories %}
     <ul>
       <li><strong><a href="{% url 'story' slug=story.slug %}"
       target="_blank">{{ story.title }} &bull; {{ story.genre|capfirst }}
       </a></strong></li>
       <li>{{ story.pub_date|date:"M d, Y" }}</li>
       <li>{{ story.content|safe }}</li>
       <hr />
     </ul>
    {% empty %}
      <p>No stories published yet.</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
